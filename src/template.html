<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGSX Library Checker</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f0f2f5; --text: #1c2230; --muted: #5f6878; --line: #dde1e8;
  --accent: #2f6fde; --accent-text: #ffffff; --good: #1f8a4c; --good-bg: #e3f4ea; --bad: #b4372f; --bad-bg: #fbe9e7;
  --warn: #8a5a00; --warn-bg: #fff3d6; --chip: #e8ecf3; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --panel2: #222733; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d3340;
    --accent: #5b8ff0; --accent-text: #0b1020; --good: #4cc584; --good-bg: #16301f; --bad: #f07a70; --bad-bg: #3a1a18;
    --warn: #f0c060; --warn-bg: #3a2e12; --chip: #2a3040; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.small { padding: 3px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
select, input[type=text], input[type=search], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
textarea { width: 100%; min-height: 120px; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header h1 span { color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: none; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--muted); }
nav button.on { background: var(--chip); color: var(--text); font-weight: 600; }
.grow { flex: 1; }
.status { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.no { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
main { padding: 18px 20px 60px; max-width: 1400px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; }
.panel h3 { font-size: 14px; margin: 14px 0 6px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row label { display: inline-flex; gap: 6px; align-items: center; }
.split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.syslist { max-height: calc(100vh - 220px); overflow: auto; margin: 8px -6px 0; }
.sysitem { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.sysitem:hover { background: var(--panel2); }
.sysitem.on { background: var(--chip); font-weight: 600; }
.sysitem small { color: var(--muted); font-weight: 400; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
td.num { color: var(--muted); width: 48px; text-align: right; }
tr.have td:first-child { box-shadow: inset 3px 0 var(--good); }
tr.miss td:first-child { box-shadow: inset 3px 0 var(--bad); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); margin: 1px 2px 1px 0; }
.tag.ok { background: var(--good-bg); color: var(--good); }
.tag.no { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; min-width: 120px; }
.bar > i { display: block; height: 100%; background: var(--good); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.card b a { text-decoration: none; }
.card p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.fcover { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; display: block; background: var(--panel2); }
.flist { display: flex; flex-direction: column; }
.frow { display: flex; gap: 12px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.frow .fthumb { width: 72px; height: 44px; flex: 0 0 auto; object-fit: cover; border-radius: 4px; background: var(--panel2); }
.frow .fmeta { min-width: 0; flex: 1; }
.frow .fdesc { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .fplats { flex: 0 0 auto; text-align: right; max-width: 42%; }
@media (max-width: 680px) { .frow .fdesc { display: none; } .frow .fplats { max-width: 50%; } }
.progress { font-size: 12px; color: var(--muted); }
.notice { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-bottom: 12px; }
.notice.info { background: var(--chip); color: var(--text); }
.notice.err { background: var(--bad-bg); color: var(--bad); }
.kv { display: grid; grid-template-columns: 190px 1fr auto; gap: 8px 12px; align-items: center; }
.kv > div:nth-child(3n+1) { color: var(--muted); }
code, pre { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; }
pre { background: var(--panel2); padding: 10px; border-radius: 8px; overflow: auto; max-height: 320px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; max-width: 680px; width: 100%; max-height: 92vh; overflow: auto; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { margin: 0 0 6px; font-size: 20px; }
.modal ol { padding-left: 20px; }
.modal li { margin: 8px 0; }
.modal .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.hidden { display: none !important; }
.langs { display: flex; gap: 4px; }
.flag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; font-size: 12px; background: transparent; }
.flag svg { border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.flag.on { background: var(--chip); border-color: var(--accent); font-weight: 600; }
.right { text-align: right; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RGSX Library Checker <span id="ver"></span></h1>
  <nav id="tabs">
    <button data-tab="library" class="on">Library</button>
    <button data-tab="topn">Top lists</button>
    <button data-tab="rgsx">RGSX</button>
    <button data-tab="free">Free games</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="help">Help</button>
  </nav>
  <div class="grow"></div>
  <div class="status" id="status"></div>
  <div class="langs" role="group" aria-label="Language">
    <button class="flag" data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30" width="22" height="12" aria-hidden="true"><clipPath id="fu"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="ft"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#fu)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#ft)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    <button class="flag" data-lang="fr" title="Français" aria-label="Français"><svg viewBox="0 0 3 2" width="18" height="12" aria-hidden="true"><path fill="#002395" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ED2939" d="M2 0h1v2H2z"/></svg>FR</button>
    <button class="flag" data-lang="es" title="Español" aria-label="Español"><svg viewBox="0 0 3 2" width="18" height="12" aria-hidden="true"><path fill="#AA151B" d="M0 0h3v2H0z"/><path fill="#F1BF00" d="M0 .5h3v1H0z"/></svg>ES</button>
  </div>
</header>
<main id="main"></main>
<div class="overlay hidden" id="intro"></div>
